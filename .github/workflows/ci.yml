name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate`, which needs no database.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Covers packages/shared too (its tests run under the root vitest)
      - name: Unit tests
        run: npm test

      # Catches type errors and broken imports across pages/routes that the
      # unit suite doesn't touch. No env needed: pages that read the DB are
      # dynamic and don't execute at build time.
      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A full Metro bundle for iOS: the closest thing to "does it build"
      # without Xcode. Catches Babel/Metro config, NativeWind, and every
      # import (including @logbook/shared) — not runtime behavior.
      - name: Bundle (iOS)
        run: npm run export:ios
        env:
          EXPO_OFFLINE: "1"
          CI: "1"
