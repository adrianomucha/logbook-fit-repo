name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate`, which needs no database.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Catches type errors and broken imports across pages/routes that the
      # unit suite doesn't touch. No env needed: pages that read the DB are
      # dynamic and don't execute at build time.
      - name: Build
        run: npm run build
